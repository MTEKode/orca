name: MTEkode release mac

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to release (default main)
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: mtekode-release-mac
  cancel-in-progress: false

env:
  ORCA_RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - id: next
        uses: ./.github/actions/mtekode-release-prepare
        with:
          ref: ${{ inputs.ref }}

  build:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Set release version
        run: npm pkg set version=${{ needs.prepare.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Build app
        run: pnpm run build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ORCA_BUILD_IDENTITY: stable
      - name: Package and upload to the draft release
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON config/scripts/orcad-distribution/prebuilds/pinned-node-downloads.mjs darwin-arm64
          node config/scripts/native-build/node-addons/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dmg zip --arm64 -c.mac.identity=- --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/mtekode-release-publish
        with:
          tag: ${{ needs.prepare.outputs.tag }}
