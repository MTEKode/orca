name: MTEkode tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtekode-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Upstream's unit-shard mode: excludes the special-lane suites (live-shell, node-pty,
      # electron probes, cross-version-wire) that need runners this workflow does not have.
      ORCA_BALANCE_UNIT_SHARDS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Debug systemd OSC hook (temporary)
        run: |
          echo "--- bashrc.d ---"; ls /etc/bash.bashrc.d/ 2>/dev/null || echo none
          echo "--- profile.d ---"; ls /etc/profile.d/ 2>/dev/null
          echo "--- grep /etc ---"; grep -rl "__systemd_osc" /etc/ 2>/dev/null | head -5
          echo "--- login probe ---"
          bash -lc '"$BASH" --noprofile --rcfile /dev/null -i -c "declare -F | grep -i systemd | head -5; printf PC=<%s> \"$PROMPT_COMMAND\""' < /dev/null 2>&1 | head -10
      - run: pnpm test
