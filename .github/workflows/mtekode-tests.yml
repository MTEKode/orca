name: MTEkode tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtekode-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Upstream's unit-shard mode: excludes the special-lane suites (live-shell, node-pty,
      # electron probes, cross-version-wire) that need runners this workflow does not have.
      ORCA_BALANCE_UNIT_SHARDS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Report shell hook state
        run: |
          bash -i -c 'source /etc/profile >/dev/null 2>&1; declare -F | grep -i systemd | head -5; echo PC=$PROMPT_COMMAND' < /dev/null 2>&1 | head -8
          head -40 /etc/profile.d/80-systemd-osc-context.sh 2>/dev/null || true
      - run: pnpm test
