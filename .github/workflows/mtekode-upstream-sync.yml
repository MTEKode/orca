name: Sync Orca upstream and release MTEkode build

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: Release the current fork commit even when upstream has not moved
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: mtekode-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MTEkode/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_requested: ${{ steps.sync.outputs.release_requested }}
      source_sha: ${{ steps.sync.outputs.source_sha }}
      release_ready: ${{ steps.readiness.outputs.release_ready }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main into the fork
        id: sync
        env:
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch --no-tags upstream main

          fork_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"
          changed=false

          if ! git merge-base --is-ancestor "$upstream_sha" "$fork_sha"; then
            if git merge-base --is-ancestor "$fork_sha" "$upstream_sha"; then
              git merge --ff-only "$upstream_sha"
            else
              git merge --no-edit "$upstream_sha"
            fi
            git push origin HEAD:main
            changed=true
          fi

          source_sha="$(git rev-parse HEAD)"
          release_requested=false
          if [[ "$changed" == true || "$FORCE_RELEASE" == true ]]; then
            release_requested=true
          fi

          echo "release_requested=$release_requested" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Fork main: $source_sha"
          echo "Upstream main: $upstream_sha"
          echo "Release requested: $release_requested"

      - name: Check signing configuration
        id: readiness
        if: steps.sync.outputs.release_requested == 'true'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORCA_SIGNPATH_ORGANIZATION_ID: ${{ vars.ORCA_SIGNPATH_ORGANIZATION_ID }}
          ORCA_SIGNPATH_PROJECT_SLUG: ${{ vars.ORCA_SIGNPATH_PROJECT_SLUG }}
          ORCA_SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.ORCA_SIGNPATH_SIGNING_POLICY_SLUG }}
          ORCA_SIGNPATH_WINDOWS_INNER_ARTIFACT_CONFIGURATION: ${{ vars.ORCA_SIGNPATH_WINDOWS_INNER_ARTIFACT_CONFIGURATION }}
          ORCA_SIGNPATH_WINDOWS_INSTALLER_ARTIFACT_CONFIGURATION: ${{ vars.ORCA_SIGNPATH_WINDOWS_INSTALLER_ARTIFACT_CONFIGURATION }}
          ORCA_WINDOWS_PUBLISHER_NAME: ${{ vars.ORCA_WINDOWS_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          required=(
            MAC_CERTS
            MAC_CERTS_PASSWORD
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
            SIGNPATH_API_TOKEN
            ORCA_SIGNPATH_ORGANIZATION_ID
            ORCA_SIGNPATH_PROJECT_SLUG
            ORCA_SIGNPATH_SIGNING_POLICY_SLUG
            ORCA_SIGNPATH_WINDOWS_INNER_ARTIFACT_CONFIGURATION
            ORCA_SIGNPATH_WINDOWS_INSTALLER_ARTIFACT_CONFIGURATION
            ORCA_WINDOWS_PUBLISHER_NAME
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if ((${#missing[@]})); then
            echo 'release_ready=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Fork release not dispatched'
              echo
              echo 'The upstream merge is complete. Add these signing secrets and repository variables before automatic releases can run:'
              echo
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Release signing setup is incomplete: ${missing[*]}"
            exit 0
          fi

          echo 'release_ready=true' >> "$GITHUB_OUTPUT"

      - name: Dispatch release build for the synced commit
        if: steps.sync.outputs.release_requested == 'true' && steps.readiness.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$SOURCE_SHA" '{ref:"main", inputs:{kind:"patch", ref:$sha}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-cut.yml/dispatches" --input -

      - name: Report idle check
        if: steps.sync.outputs.release_requested != 'true'
        run: echo 'Upstream main has not advanced; no release was requested.' >> "$GITHUB_STEP_SUMMARY"
